version: 2

registries:
  # @thepia/branding is published to GitHub Packages (private, authenticated
  # registry) - without this, Dependabot's sandboxed updater can't resolve
  # the lockfile at all (401 Unauthorized), which fails EVERY npm update job,
  # not just ones touching @thepia packages. Requires a `read:packages`-scoped
  # PAT stored as the DEPENDABOT_NPM_GITHUB_TOKEN secret under this repo's
  # Settings -> Secrets and variables -> Dependabot.
  #
  # `scope` is required here even though the repo has no committed .npmrc:
  # per GitHub's docs, Dependabot only generates an authenticated .npmrc
  # entry for a registry when `scope` (or `replaces-base`) is set on it, or
  # when a committed .npmrc already maps the scope. Without `scope`, it still
  # infers the *host* to hit from the pnpm lockfile (which is why requests
  # correctly reached npm.pkg.github.com) but never attaches the token -
  # exactly the "No authorization header was set" failure seen without this.
  github-packages-thepia:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@thepia"
    token: ${{secrets.DEPENDABOT_NPM_GITHUB_TOKEN}}

updates:
  # npm / pnpm dependencies (root library + example workspaces)
  - package-ecosystem: npm
    directory: "/"
    registries:
      - github-packages-thepia
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates into single PRs to cut review noise.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Peer dep pinned to an exact version on purpose; bump deliberately.
      - dependency-name: "@xyflow/svelte"
    labels:
      - dependencies

  # Keep the GitHub Actions used in workflows up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
